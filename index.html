const { useState, useEffect, useRef, useCallback } = React;

/* ─────────────────────────────────────────────
   useTypewriter hook
   ───────────────────────────────────────────── */
function useTypewriter(text, speed = 38, startDelay = 600) {
  const [displayed, setDisplayed] = useState('');
  const [done, setDone] = useState(false);
  const indexRef = useRef(0);
  const intervalRef = useRef(null);
  const timeoutRef = useRef(null);

  useEffect(() => {
    setDisplayed('');
    setDone(false);
    indexRef.current = 0;

    timeoutRef.current = setTimeout(() => {
      intervalRef.current = setInterval(() => {
        indexRef.current += 1;
        if (indexRef.current >= text.length) {
          setDisplayed(text);
          setDone(true);
          clearInterval(intervalRef.current);
          intervalRef.current = null;
        } else {
          setDisplayed(text.slice(0, indexRef.current));
        }
      }, speed);
    }, startDelay);

    return () => {
      if (timeoutRef.current) clearTimeout(timeoutRef.current);
      if (intervalRef.current) clearInterval(intervalRef.current);
    };
  }, [text, speed, startDelay]);

  return { displayed, done };
}

/* ─────────────────────────────────────────────
   BackgroundVideo — mouse scrub controlled
   ───────────────────────────────────────────── */
const SENSITIVITY = 0.8;

function BackgroundVideo() {
  const videoRef = useRef(null);
  const targetTimeRef = useRef(0);
  const prevXRef = useRef(null);
  const seekingRef = useRef(false);

  const trySeek = useCallback(() => {
    const video = videoRef.current;
    if (!video || !video.duration) return;
    if (seekingRef.current) return;

    const clamped = Math.max(0, Math.min(video.duration, targetTimeRef.current));
    // Only seek if there's meaningful distance
    if (Math.abs(video.currentTime - clamped) < 0.01) return;

    seekingRef.current = true;
    video.currentTime = clamped;
  }, []);

  useEffect(() => {
    const video = videoRef.current;
    if (!video) return;

    const handleLoadedMetadata = () => {
      targetTimeRef.current = 0;
      video.currentTime = 0;
    };

    const handleSeeked = () => {
      seekingRef.current = false;
      // If target moved while seeking, seek again
      trySeek();
    };

    video.addEventListener('loadedmetadata', handleLoadedMetadata);
    video.addEventListener('seeked', handleSeeked);

    const handleMouseMove = (e) => {
      if (!video || !video.duration) return;
      const currentX = e.clientX;

      if (prevXRef.current === null) {
        prevXRef.current = currentX;
        return;
      }

      const delta = currentX - prevXRef.current;
      prevXRef.current = currentX;

      const timeDelta = (delta / window.innerWidth) * SENSITIVITY * video.duration;
      targetTimeRef.current = Math.max(
        0,
        Math.min(video.duration, targetTimeRef.current + timeDelta)
      );

      trySeek();
    };

    // Also handle touch for mobile — horizontal drag scrubs
    let touchPrevX = null;
    const handleTouchStart = (e) => {
      if (e.touches[0]) touchPrevX = e.touches[0].clientX;
    };
    const handleTouchMove = (e) => {
      if (!video || !video.duration || !e.touches[0]) return;
      if (touchPrevX === null) {
        touchPrevX = e.touches[0].clientX;
        return;
      }
      const currentX = e.touches[0].clientX;
      const delta = currentX - touchPrevX;
      touchPrevX = currentX;
      const timeDelta = (delta / window.innerWidth) * SENSITIVITY * video.duration;
      targetTimeRef.current = Math.max(
        0,
        Math.min(video.duration, targetTimeRef.current + timeDelta)
      );
      trySeek();
    };

    window.addEventListener('mousemove', handleMouseMove);
    window.addEventListener('touchstart', handleTouchStart, { passive: true });
    window.addEventListener('touchmove', handleTouchMove, { passive: true });

    return () => {
      video.removeEventListener('loadedmetadata', handleLoadedMetadata);
      video.removeEventListener('seeked', handleSeeked);
      window.removeEventListener('mousemove', handleMouseMove);
      window.removeEventListener('touchstart', handleTouchStart);
      window.removeEventListener('touchmove', handleTouchMove);
    };
  }, [trySeek]);

  return (
    <video
      ref={videoRef}
      muted
      playsInline
      preload="auto"
      style={{
        position: 'fixed',
        inset: 0,
        zIndex: 0,
        width: '100%',
        height: '100%',
        objectFit: 'cover',
        objectPosition: '70% center',
        pointerEvents: 'none',
      }}
    >
      <source
        src="https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260826_041744_63efcd78-bf7d-4039-99e2-2461e8a61903.mp4"
        type="video/mp4"
      />
    </video>
  );
}

    if (mobileOpen) {
      document.body.style.overflow = 'hidden';
    } else {
      document.body.style.overflow = '';
    }
    return () => {
      document.body.style.overflow = '';
    };
  }, [mobileOpen]);

  const toggleMobile = () => setMobileOpen((v) => !v);
  const closeMobile = () => setMobileOpen(false);

  return (

    borderColor: 'rgba(255,255,255,0.2)',

    display: 'inline-flex',

    justifyContent: 'center',
    borderRadius: '9999px',
    fontSize: 'clamp(13px, 1.8vw, 15px)',
    paddingTop: '0.3em',
    paddingBottom: '0.3em',
    paddingLeft: 'clamp(16px, 2vw, 20px)',
    paddingRight: 'clamp(16px, 2vw, 20px)',
    marginLeft: '0.2em',
    marginRight: '0.2em',
    marginBottom: '0.4em',
    whiteSpace: 'nowrap',
    border: '1px solid #fff',
    background: 'transparent',

    cursor: 'pointer',
    gap: 'clamp(8px, 1vw, 12px)',

        zIndex: 1,

      {/* Slight dark gradient at bottom for readability on mobile */}

          zIndex: 0,

        aria-hidden="true"

        style={{
          zIndex: 10,

          width: '100%',

      >
        {/* Blurred intro label */}
        <div
          style={{
            pointerEvents: 'none',
            userSelect: 'none',
            marginBottom: 'clamp(20px, 3vw, 24px)',
            fontSize: 'clamp(18px, 4vw, 26px)',
            lineHeight: 1.3,
            fontWeight: 400,
            color: '#fff',

          你好，认识一下 A.R.I.A

        </div>

        {/* Typewriter text */}
        <p

            color: '#fff',

        {/* Action pills */}
        <div
          className={`pill-enter flex flex-wrap ${pillsVisible ? 'is-visible' : ''}`}

          <button
            type="button"
            onClick={handleCopyEmail}
            style={outlinePillStyle}
            onMouseEnter={(e) => Object.assign(e.currentTarget.style, outlineHoverStyle)}

              e.currentTarget.style.color = outlinePillStyle.color;

function PillButton({ label }) {
  const [hover, setHover] = useState(false);
  const style = {
    display: 'inline-flex',
    alignItems: 'center',
    justifyContent: 'center',
    borderRadius: '9999px',
    fontSize: 'clamp(13px, 1.8vw, 15px)',
    paddingTop: '0.3em',
    paddingBottom: '0.3em',
    paddingLeft: 'clamp(16px, 2vw, 20px)',
    paddingRight: 'clamp(16px, 2vw, 20px)',
    marginLeft: '0.2em',
    marginRight: '0.2em',
    marginBottom: '0.4em',
    whiteSpace: 'nowrap',
    border: '1px solid rgba(0,0,0,0.10)',
    background: hover ? '#000' : '#fff',
    color: hover ? '#fff' : '#000',
    cursor: 'pointer',
    transition: 'background-color 0.2s ease, color 0.2s ease, border-color 0.2s ease',
    textDecoration: 'none',
    fontFamily: 'var(--font-body)',
  };

  return (
    <a
      href="#"
      style={style}
      onMouseEnter={() => setHover(true)}
      onMouseLeave={() => setHover(false)}
      onClick={(e) => e.preventDefault()}
    >
      {label}
    </a>
  );
}

   App

function App() {

      <main style={{ position: 'relative', zIndex: 1 }}>

}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
